# Central configuration. Paths are relative to the project root.
# Changing a target parameter changes the problem being solved: record the
# reason in docs/decisions.md.

project:
  name: ai-financial-crisis-detector
  random_seed: 42

market:
  ticker: "^GSPC"          # S&P 500 index (Yahoo Finance symbol)
  vix_ticker: "^VIX"       # CBOE Volatility Index; features will lag it by one day (D10)
  price_column: "Close"
  start_date: "1990-01-01" # VIX history also starts in 1990
  end_date: "2026-10-23"   # frozen: last completed trading date in the snapshot (D10)

# Market-stress target (see docs/decisions.md, D2)
market_stress_target:
  horizon_trading_days: 20
  drawdown_threshold: 0.05          # 5% decline
  peak_definition: "forward_running_max"

# Chronological evaluation (see docs/decisions.md, D3)
evaluation:
  split_method: "walk_forward"
  purge_gap_trading_days: 20        # must be >= horizon_trading_days

# Market-stress dataset and splits (see docs/decisions.md, D12)
market_stress:
  validation_first_year: 2000       # one walk-forward validation block per calendar year
  validation_last_year: 2014        # development data ends in 2014
  test_start: "2015-01-01"          # held-out test: 2015 to the last labelled row
  # Phase C models (see docs/decisions.md, D13). Fixed settings, no tuning.
  rule_baselines: ["vix_pct_252", "downside_vol_20"]   # raw feature values used as scores
  threshold_rule: "max_f1"          # chosen on pooled walk-forward validation predictions only
  min_positives_reliable: 10        # per-year metrics with fewer label-1 rows are flagged
  bootstrap_resamples: 2000
  bootstrap_block_length: 60        # sessions; 3x the 20-session label horizon
  bootstrap_sensitivity_blocks: [20, 120]
  logistic_regression:
    C: 1.0
    max_iter: 5000
  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    tree_method: "hist"
    n_jobs: 4

# Company distress model (see docs/decisions.md, D8)
company_distress:
  test_size: 0.2                    # stratified hold-out share
  cv_folds: 5                       # stratified CV within the training set
  # Baseline models (see docs/decisions.md, D9). Fixed settings, no tuning.
  cv_repeats: 3
  bootstrap_resamples: 2000
  permutation_rounds: 5
  large_value_threshold: 1.0        # values above this are "large" (cause unknown)
  threshold_rule: "max_f1"          # chosen on training out-of-fold predictions only
  logistic_regression:
    C: 1.0
    max_iter: 5000
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: "hist"
    n_jobs: 4

# Local document question answering (see docs/decisions.md, D14)
rag:
  sources:                          # glob patterns relative to the project root (.md and .txt)
    - "README.md"
    - "docs/*.md"
    - "data/reports/**/*.md"        # locally generated reports (ignored by Git)
    - "knowledge_base/documents/**/*.md"
    - "knowledge_base/documents/**/*.txt"
  exclude:                          # never index the RAG's own outputs (they quote the evaluation questions)
    - "data/reports/rag/**/*"
  index_dir: "artifacts/rag/index"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"   # Apache-2.0, runs on CPU
  chunk_size: 800                   # characters
  chunk_overlap: 120
  top_k: 4
  min_relevance: 0.30               # cosine; below this the answer is "insufficient evidence" (fixed, not tuned)
  max_answer_sentences: 3
  eval_set: "knowledge_base/eval/retrieval_questions.json"
  eval_k: [1, 3, 5]
  reports_dir: "data/reports/rag"
  ollama_model: "qwen2.5:3b"        # optional generator; used only with --llm ollama (D5)

paths:
  raw_data: "data/raw"
  interim_data: "data/interim"
  processed_data: "data/processed"
  data_reports: "data/reports"   # generated data-quality reports (ignored by Git)
  models: "artifacts/models"
  reports: "reports"
