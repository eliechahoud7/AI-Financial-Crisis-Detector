[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fincrisis"
version = "0.1.0"
description = "Local AI system for financial distress prediction, market-stress forecasting, anomaly detection, regime classification, and RAG-based risk recommendations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Elie Chahoud", email = "eliechahoud1@users.noreply.github.com" }]
# Compatible ranges here; exact versions are recorded in a lock file after install.
# Phase A: data and models.
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=3.0.6,<3.1",
    "scikit-learn>=1.9,<2",
    "xgboost>=3.4,<4",
    "yfinance>=1.7,<2",
    "matplotlib>=3.11,<4",
    "plotly>=7.1,<8",
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "jupyter>=1.1,<2",
]
# Local RAG (D14). Install torch from the CPU index:
#   pip install -e ".[rag]" --extra-index-url https://download.pytorch.org/whl/cpu
rag = [
    "langchain-core>=1.6,<1.7",
    "langchain-text-splitters>=1.1,<1.2",
    "langchain-huggingface>=1.2,<1.3",
    "sentence-transformers>=6.1,<6.2",
    "transformers>=5.19,<5.20",
    "faiss-cpu>=1.15,<1.16",
    "torch>=2.14,<2.15",
]
# LangGraph workflow (D17); langgraph-sdk 0.4.6 needs websockets < 17
agent = [
    "langgraph>=1.2.14,<1.3",
    "langgraph-checkpoint>=4.2,<4.3",
    "langgraph-sdk>=0.4.6,<0.4.7",
    "langgraph-prebuilt>=1.1.0,<1.1.1",
]
# Local Streamlit dashboard (Phase G). starlette is pinned below the newest
# release; streamlit 1.66.1 is the first release that accepts pillow 13.
app = [
    "streamlit>=1.66.1,<1.67",
    "starlette>=1.7.0,<1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
